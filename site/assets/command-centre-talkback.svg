ten into the page or repository.</text><rect x="748" y="188" width="662" height="570" rx="12" fill="#102231" stroke="#20384a"/><text x="778" y="230" fill="#fff" font-family="Arial" font-size="18" font-weight="700">Speak through device</text><text x="778" y="276" fill="#8196a8" font-family="Arial" font-size="12">TARGET DEVICE</text><rect x="778" y="292" width="602" height="48" rx="7" fill="#091720" stroke="#294354"/><text x="798" y="322" fill="#fff" font-family="Arial" font-size="14">Sentinel 01 · mobile</text><path d="m1348 312 9 9 9-9" fill="none" stroke="#8196a8"/><text x="778" y="382" fill="#8196a8" font-family="Arial" font-size="12">MESSAGE</text><rect x="778" y="398" width="602" height="152" rx="7" fill="#091720" stroke="#294354"/><text x="798" y="431" fill="#6b8294" font-family="Arial" font-size="14">Security operator speaking…</text><rect x="778" y="580" width="156" height="42" rx="7" fill="#28678f"/><text x="808" y="607" fill="#fff" font-family="Arial" font-size="13">Speak message</text><rect x="950" y="580" width="176" height="42" rx="7" fill="#1a3041"/><text x="979" y="607" fill="#fff" font-family="Arial" font-size="13">Hold / tap to record</text><text x="778" y="654" fill="#7f95a8" font-family="Arial" font-size="12">Recorded audio is sent only to the selected device.</text><rect x="778" y="688" width="602" height="44" rx="7" fill="#122b27" stroke="#275c4c"/><circle cx="801" cy="710" r="6" fill="#55d69d"/><text x="819" y="715" fill="#a7d9c7" font-family="Arial" font-size="13">Announcements, recordings and device acknowledgements are audited.</text></svg>
