name: package

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - run: python -m pip install dist/openpatrol-*.whl
      - run: openpatrol doctor --json
      - run: openpatrol hardware check all --json
      - uses: actions/upload-artifact@v4
        with:
          name: openpatrol-python-package
          path: dist/*
