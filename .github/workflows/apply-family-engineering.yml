name: apply-family-engineering-overlay

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Apply reviewed engineering overlay
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .openpatrol/READY ]]; then
            echo "Overlay already applied."
            exit 0
          fi
          cat .openpatrol/family-engineering.part-* | base64 --decode | tar -xzf - -C .
          chmod +x scripts/export-hardware.sh
          rm -rf .openpatrol
          git config user.name "openpatrol-engineering-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Complete AirScout and Sentinel Rev-A engineering family"
          git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
