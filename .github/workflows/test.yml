name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q openpatrol tests
      - run: python -m openpatrol.hardware_harness --output /tmp/hardware-report.json
      - run: |
          python -m openpatrol.server &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          python - <<'PY'
          import time, urllib.request
          for _ in range(30):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8765/api/v1/health") as response:
                      assert response.status == 200
                      break
              except OSError: time.sleep(.1)
          else: raise SystemExit("server did not become healthy")
          PY
