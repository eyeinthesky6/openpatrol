name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/assets/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy source-aligned engineering assets
        run: |
          mkdir -p site/assets
          cp docs/assets/openpatrol-hardware-family-concept.svg site/assets/
          cp docs/assets/sentinel-mast-envelope.svg site/assets/
          cp docs/assets/airscout-envelope.svg site/assets/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
