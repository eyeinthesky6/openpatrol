name: hardware-cad

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The matrix validates all four packs independently. OpenSCAD 2021.01 can
# return non-zero after writing a valid multi-body mesh, so the export script
# validates the non-empty artifact rather than trusting the process code alone.

jobs:
  export-platform:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        platform:
          - rover-one-rev-a
          - triscout-rev-a
          - airscout-rev-a
          - sentinel-rev-a
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad
      - name: Export fabrication pack
        run: ./scripts/export-hardware.sh "${{ matrix.platform }}"
      - name: Verify expected artifacts
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          platform = os.environ["PLATFORM"]
          root = Path("dist/hardware") / platform
          expected = {
              "rover-one-rev-a": [
                  "lower_deck.dxf", "upper_deck.dxf", "motor_saddle.stl",
                  "camera_bracket.stl", "assembly.stl", "BOM.csv",
              ],
              "triscout-rev-a": [
                  "lower_deck.dxf", "upper_deck.dxf", "motor_saddle.stl",
                  "camera_bracket.stl", "assembly.stl", "BOM.csv",
              ],
              "airscout-rev-a": [
                  "lower_plate.dxf", "upper_plate.dxf", "motor_mount.stl",
                  "prop_guard_segment.stl", "shell_top.stl", "assembly.stl", "BOM.csv",
              ],
              "sentinel-rev-a": [
                  "lower_deck.dxf", "mast_base.dxf", "mast_bushing.stl",
                  "mask_frame.stl", "head_shell.stl", "assembly.stl", "BOM.csv",
              ],
          }[platform]
          missing = []
          for name in expected:
              path = root / name
              if not path.is_file() or path.stat().st_size < 32:
                  missing.append(str(path))
          if missing:
              raise SystemExit("Missing/empty CAD artifacts:\n" + "\n".join(missing))
          print(f"Verified {platform}: {len(expected)} required artifacts")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: openpatrol-hardware-${{ matrix.platform }}
          path: dist/hardware/${{ matrix.platform }}
