name: hardware-cad

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-all-platforms:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad xvfb
      - name: Export every fabrication pack
        run: xvfb-run -a ./scripts/export-hardware.sh all
      - name: Verify expected artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('dist/hardware')
          expected={
            'rover-one-rev-a': ['lower_deck.dxf','upper_deck.dxf','motor_saddle.stl','assembly.png'],
            'triscout-rev-a': ['lower_deck.dxf','upper_deck.dxf','motor_saddle.stl','assembly.png'],
            'airscout-rev-a': ['lower_plate.dxf','upper_plate.dxf','motor_mount.stl','shell_top.stl','assembly.png'],
            'sentinel-rev-a': ['lower_deck.dxf','mast_base.dxf','mast_bushing.stl','mask_frame.stl','assembly.png'],
          }
          missing=[]
          for platform, files in expected.items():
            for name in files:
              path=root/platform/name
              if not path.is_file() or path.stat().st_size == 0:
                missing.append(str(path))
          if missing:
            raise SystemExit('Missing/empty CAD artifacts:\n'+'\n'.join(missing))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: openpatrol-hardware-rev-a
          path: dist/hardware
