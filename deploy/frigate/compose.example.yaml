services:
  mqtt:
    image: eclipse-mosquitto:2
    restart: unless-stopped
  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable
    restart: unless-stopped
    shm_size: "256mb"
    volumes:
      - ./config.example.yml:/config/config.yml:ro
      - frigate-media:/media/frigate
  bridge:
    build: ../..
    command: ["openpatrol-frigate", "--mqtt-host", "mqtt"]
    environment:
      OPENPATROL_URL: http://openpatrol:8765
      OPENPATROL_INGEST_TOKEN: ${OPENPATROL_INGEST_TOKEN:?set token}
      FRIGATE_URL: http://frigate:5000
  openpatrol:
    build: ../..
    environment:
      OPENPATROL_HOST: 0.0.0.0
      OPENPATROL_INGEST_TOKEN: ${OPENPATROL_INGEST_TOKEN:?set token}
volumes:
  frigate-media:
