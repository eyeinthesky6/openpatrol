<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="t d">
<title id="t">Sentinel Rev-A mast envelope</title><desc id="d">Retracted and extended Sentinel with key dimensions and interlocks.</desc>
<defs><linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f7f8f8"/><stop offset="1" stop-color="#dfe4e7"/></linearGradient><style>.h{font:700 34px Arial,sans-serif;fill:#283137}.p{font:400 21px Arial,sans-serif;fill:#58646b}.dim{stroke:#64727a;stroke-width:3;fill:none}.shell{fill:#e7e4dc;stroke:#bbb9b3;stroke-width:4}.dark{fill:#25282b}.glass{fill:#101418}.blue{fill:#2f8bff}.amber{fill:#ffb343}.wheel{fill:#161719;stroke:#3f4549;stroke-width:7}</style></defs>
<rect width="1400" height="900" fill="url(#bg2)"/><text x="60" y="68" class="h">Sentinel Rev-A · mast envelope</text><text x="60" y="104" class="p">The head rises for inspection; navigation lidar remains fixed on the base.</text>
<line x1="70" y1="790" x2="1330" y2="790" stroke="#aeb6ba" stroke-width="4"/>
