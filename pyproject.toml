[project]
name = "openpatrol"
version = "0.2.0"
description = "Mobility-agnostic local-first patrol and evidence system"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

[project.scripts]
openpatrol = "openpatrol.server:main"
openpatrol-frigate = "openpatrol.frigate_bridge:main"

[project.optional-dependencies]
dev = []
mqtt = ["paho-mqtt>=2.1,<3"]

[tool.setuptools]
packages = ["openpatrol"]
