[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openpatrol"
version = "0.4.0"
description = "Mobility-agnostic local-first patrol and evidence system"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "OpenPatrol contributors"}]
keywords = ["robotics", "patrol", "ros2", "evidence", "simulation", "mavlink"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/eyeinthesky6/openpatrol"
Repository = "https://github.com/eyeinthesky6/openpatrol"
Issues = "https://github.com/eyeinthesky6/openpatrol/issues"

[project.scripts]
openpatrol = "openpatrol.cli:main"
openpatrol-server = "openpatrol.server:main"
openpatrol-frigate = "openpatrol.frigate_bridge:main"
openpatrol-vision-adapter = "openpatrol.vision_adapter:main"
openpatrol-exercise = "openpatrol.exercise:main"
openpatrol-hardware-test = "openpatrol.hardware_harness:main"

[project.optional-dependencies]
dev = ["build>=1.2"]
mqtt = ["paho-mqtt>=2.1,<3"]
vision = ["paho-mqtt>=2.1,<3"]

[tool.setuptools]
packages = ["openpatrol", "static", "scenarios"]
include-package-data = true

[tool.setuptools.package-data]
openpatrol = ["profiles/*.json"]
static = ["*.html", "*.js", "*.css", "assets/*"]
scenarios = ["*.json"]
